networks:
  lifedesk-net:
    driver: bridge

services:
  # Express app (production)
  app:
    image: ghcr.io/denisfriz/lifedesk-backend-app:latest
    restart: unless-stopped
    networks:
      - lifedesk-net
    ports:
      - '127.0.0.1:3001:3001'
    env_file:
      - .env.production
    environment:
      PORT: '3001'
      NODE_ENV: 'production'
    stop_grace_period: 30s

  # BullMQ worker (production)
  worker:
    image: ghcr.io/denisfriz/lifedesk-backend-worker:latest
    restart: unless-stopped
    networks:
      - lifedesk-net
    env_file:
      - .env.production
    environment:
      NODE_ENV: 'production'

