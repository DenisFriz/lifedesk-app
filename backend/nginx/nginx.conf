# HTTP redirect to HTTPS
server {
  listen 80;
  server_name api.lifedesk.com;

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server block
server {
  listen 443 ssl;
  server_name api.lifedesk.com;

  # SSL certificates (generated by certbot)
  ssl_certificate     /etc/letsencrypt/live/api.lifedesk.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.lifedesk.com/privkey.pem;

  # Allow larger uploads (e.g. file upload endpoint)
  client_max_body_size 10m;

  # Reverse proxy to the Express app
  location / {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
